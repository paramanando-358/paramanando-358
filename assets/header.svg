<svg width="1200" height="260" viewBox="0 0 1200 260"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="background" x1="0" y1="0" x2="1200" y2="260">
  <stop offset="0%" stop-color="#020817"/>
  <stop offset="48%" stop-color="#06172B"/>
  <stop offset="100%" stop-color="#1155C8"/>
</linearGradient>

<linearGradient id="waveA" x1="0" y1="0" x2="1200" y2="0">
  <stop offset="0%" stop-color="#0A3478"/>
  <stop offset="50%" stop-color="#1558C8"/>
  <stop offset="100%" stop-color="#087EFF"/>
</linearGradient>

<linearGradient id="title" x1="300" y1="0" x2="900" y2="0">
  <stop stop-color="#58A6FF"/>
  <stop offset="0.5" stop-color="#2F81F7"/>
  <stop offset="1" stop-color="#79C0FF"/>
</linearGradient>

<radialGradient id="glow">
  <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.28"/>
  <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
</radialGradient>

<filter id="titleGlow">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>

<rect
width="1200"
height="260"
rx="22"
fill="url(#background)"
/>

<ellipse
cx="600"
cy="80"
rx="420"
ry="170"
fill="url(#glow)"
/>

<!-- stars -->

<g fill="#58A6FF">

<circle cx="55" cy="38" r="2">
  <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
</circle>

<circle cx="180" cy="78" r="2">
  <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
</circle>

<circle cx="315" cy="48" r="2">
  <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
</circle>

<circle cx="900" cy="48" r="2">
  <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
</circle>

<circle cx="1060" cy="70" r="2">
  <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
</circle>

<circle cx="1140" cy="38" r="2">
  <animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/>
</circle>

</g>

<!-- title -->

<text 
x="600" 
y="78" 
text-anchor="middle" 
font-family="Segoe UI, Arial, sans-serif" 
font-size="37" 
font-weight="700" 
fill="#79A9D8">
Hi 👋 I’m Paramanando
</text>

<text
x="600"
y="122"
text-anchor="middle"
font-family="Segoe UI, Arial, sans-serif"
font-size="23"
font-weight="600"
fill="#FFFFFF">
Computer Science Student &amp; Full-Stack Web Developer
</text>

<text
x="600"
y="159"
text-anchor="middle"
font-family="Segoe UI, Arial, sans-serif"
font-size="16"
fill="#D8E6FA">
Building real-world solutions through code • Turning ideas into working products
</text>


<!-- animated waves -->

<g>

<path
d="M0 214
C70 180 140 180 210 214
S350 248 420 214
S560 180 630 214
S770 248 840 214
S980 180 1050 214
S1140 238 1200 208
V260 H0 Z"
fill="#0B3E8F"
opacity="0.72">

<animateTransform
attributeName="transform"
type="translate"
values="-20 0;20 0;-20 0"
dur="7s"
repeatCount="indefinite"/>

</path>

<path
d="M0 229
C75 205 150 205 225 229
S375 253 450 229
S600 205 675 229
S825 253 900 229
S1050 205 1200 233
V260 H0 Z"
fill="url(#waveA)"
opacity="0.84">

<animateTransform
attributeName="transform"
type="translate"
values="20 0;-20 0;20 0"
dur="6s"
repeatCount="indefinite"/>

</path>

</g>

</svg>
