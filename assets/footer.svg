<svg width="1200" height="190" viewBox="0 0 1200 190"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="footerBackground" x1="0" y1="0" x2="1200" y2="190">
  <stop offset="0%" stop-color="#020817"/>
  <stop offset="50%" stop-color="#06172B"/>
  <stop offset="100%" stop-color="#104CB5"/>
</linearGradient>

<linearGradient id="footerWave" x1="0" y1="0" x2="1200" y2="0">
  <stop stop-color="#0B3D91"/>
  <stop offset="0.5" stop-color="#1F6FEB"/>
  <stop offset="1" stop-color="#58A6FF"/>
</linearGradient>

<linearGradient id="footerText" x1="350" y1="0" x2="850" y2="0">
  <stop stop-color="#58A6FF"/>
  <stop offset="0.5" stop-color="#2F81F7"/>
  <stop offset="1" stop-color="#79C0FF"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>


<rect
width="1200"
height="190"
rx="20"
fill="url(#footerBackground)"
/>


<text
x="600"
y="52"
text-anchor="middle"
font-family="Segoe UI, Arial, sans-serif"
font-size="23"
font-weight="700"
fill="url(#footerText)"
filter="url(#glow)">
💻 Building • Learning • Improving
</text>


<text
x="600"
y="82"
text-anchor="middle"
font-family="Segoe UI, Arial, sans-serif"
font-size="15"
font-style="italic"
fill="#D8E6FA">
Turning ideas into working products, one commit at a time.
</text>


<path
d="M0 132
C75 105 150 105 225 132
S375 159 450 132
S600 105 675 132
S825 159 900 132
S1050 105 1200 136
V190 H0 Z"
fill="#0B3E8F"
opacity="0.65">

<animateTransform
attributeName="transform"
type="translate"
values="-25 0;25 0;-25 0"
dur="7s"
repeatCount="indefinite"/>

</path>


<path
d="M0 150
C80 125 160 125 240 150
S400 175 480 150
S640 125 720 150
S880 175 960 150
S1120 125 1200 150
V190 H0 Z"
fill="url(#footerWave)"
opacity="0.85">

<animateTransform
attributeName="transform"
type="translate"
values="25 0;-25 0;25 0"
dur="6s"
repeatCount="indefinite"/>

</path>

</svg>
